<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21">
  <defs>
    <linearGradient id="gold-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#e5b63b"/>
      <stop offset="72%" stop-color="#b87814"/>
      <stop offset="100%" stop-color="#6c3f02"/>
    </linearGradient>
    <linearGradient id="gold-face" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#fff0a2"/>
