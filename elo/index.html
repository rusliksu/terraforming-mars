<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TM ELO Ratings</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
h1, h2 { color: #ff6b35; text-align: center; }
h2 { font-size: 1.3em; margin-top: 40px; }
.stats { text-align: center; color: #888; margin-bottom: 10px; }
.stats .highlight { color: #c4a35a; font-weight: 600; }
.stats-note { text-align: center; color: #777; margin-bottom: 14px; font-size: 0.9em; }
.tabs { text-align: center; margin-bottom: 20px; }
.tab { display: inline-block; padding: 8px 20px; margin: 0 4px; background: #16213e; border: 1px solid #333; border-radius: 6px; cursor: pointer; color: #888; transition: all 0.2s; }
.tab.active { background: #ff6b35; color: #fff; border-color: #ff6b35; }
.tab:hover:not(.active) { border-color: #ff6b35; color: #ccc; }
table { border-collapse: collapse; width: 100%; max-width: 700px; margin: 0 auto; }
th { background: #16213e; color: #c4a35a; padding: 10px; text-align: left; border-bottom: 2px solid #333; }
td { padding: 8px 10px; border-bottom: 1px solid #333; }
tr:hover { background: #16213e; }
.rank { color: #888; width: 40px; }
.elo { font-weight: bold; color: #ff6b35; }
.place { color: #2ecc71; }
.games { color: #888; }
a { color: #ff6b35; text-decoration: none; }
a:hover { text-decoration: underline; }
.nav { text-align: center; margin-bottom: 20px; }
.player-link { cursor: pointer; color: #e0e0e0; transition: color 0.2s; }
.player-link:hover { color: #ff6b35; text-decoration: underline; }
.player-link.active-filter { color: #ff6b35; font-weight: bold; }

/* Recent Games */
.games-section { max-width: 900px; margin: 0 auto; }
.games-summary { text-align: center; color: #c4a35a; margin: -8px 0 16px; font-size: 0.98em; font-weight: 600; }
.filter-bar { text-align: center; margin-bottom: 15px; min-height: 24px; }
.filter-tag { display: inline-block; background: #ff6b35; color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 0.85em; }
.filter-tag .clear { cursor: pointer; margin-left: 6px; opacity: 0.7; }
.filter-tag .clear:hover { opacity: 1; }
.game-card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; transition: border-color 0.2s; }
.game-card:hover { border-color: #ff6b35; }
.game-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 6px; font-size: 0.85em; color: #888; }
.game-header-right { display: inline-flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
.game-header a { font-size: 0.8em; }
.game-server { text-transform: capitalize; }
.game-gen { color: #c4a35a; }
.game-duration { color: #7cc8ff; }
.game-date { color: #cfcfcf; }
.game-badges { display: inline-flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
.game-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 0.75em; line-height: 1.2; border: 1px solid transparent; }
.game-badge-source { background: rgba(104, 109, 224, 0.15); border-color: rgba(104, 109, 224, 0.4); color: #a8b2ff; }
.game-badge-source-shadowlogger, .game-badge-source-shadow { background: rgba(255, 107, 53, 0.16); border-color: rgba(255, 107, 53, 0.45); color: #ffb089; }
.game-badge-source-import { background: rgba(64, 201, 255, 0.14); border-color: rgba(64, 201, 255, 0.38); color: #8fdefd; }
.game-badge-source-manual { background: rgba(196, 163, 90, 0.16); border-color: rgba(196, 163, 90, 0.45); color: #e6cf8d; }
.game-badge-review { background: rgba(46, 204, 113, 0.12); border-color: rgba(46, 204, 113, 0.38); color: #89e2b1; }
.game-badge-review-claude { background: rgba(255, 159, 67, 0.12); border-color: rgba(255, 159, 67, 0.38); color: #ffd29b; }
.game-badge-target { background: transparent; border-color: #555; color: #b9b9b9; }
.game-results { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.game-player { display: inline-flex; align-items: center; gap: 4px; }
.game-player .pname { font-weight: 500; }
.game-player .pvp { color: #888; font-size: 0.9em; }
.game-player .pcorp { color: #666; font-size: 0.8em; }
.game-player .pdelta.pos { color: #2ecc71; font-weight: bold; }
.game-player .pdelta.neg { color: #e74c3c; }
.game-player .pdelta.zero { color: #888; }
.game-sep { color: #555; font-weight: bold; }
.winner .pname { color: #2ecc71; }
.show-more { text-align: center; margin-top: 15px; }
.show-more button { background: #16213e; color: #ff6b35; border: 1px solid #ff6b35; padding: 8px 24px; border-radius: 6px; cursor: pointer; font-size: 0.95em; }
.show-more button:hover { background: #ff6b35; color: #fff; }
.no-games { text-align: center; color: #666; padding: 20px; }
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.pagination button { background: #16213e; color: #c4a35a; border: 1px solid #444; padding: 7px 12px; border-radius: 6px; cursor: pointer; min-width: 40px; }
.pagination button:hover:not(:disabled) { border-color: #ff6b35; color: #ff6b35; }
.pagination button.active { background: #ff6b35; border-color: #ff6b35; color: #fff; }
.pagination button:disabled { opacity: 0.45; cursor: default; }
.pagination-status { color: #888; font-size: 0.9em; }
</style>
</head>
<body>
<div class="nav"><a href="/">&#8592; Back to game</a></div>
<h1>TM ELO Ratings</h1>
<div class="stats" id="stats"></div>
<div class="stats-note">Avg place = normalized finish score. Avg gen = average game generation. VP Margin = average gap to 2nd place if you win, otherwise gap to 1st.</div>
<div class="tabs">
  <span class="tab active" data-mode="place">By Placement</span>
  <span class="tab" data-mode="vp">By VP Margin</span>
</div>
<table>
<thead><tr><th class="rank">#</th><th>Player</th><th>ELO</th><th>Avg place</th><th>Games</th><th>Avg VP</th><th>Avg gen</th><th>VP Margin</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<h2 id="games-title">Recent Games</h2>
<div class="games-section">
  <div class="games-summary" id="gamesSummary"></div>
  <div class="filter-bar" id="filterBar"></div>
  <div id="gamesList"></div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
var _data = null;
var _mode = "place";
var _filterPlayer = null;
var _gamesPage = 1;
var _derivedPlayerStats = {};
var _preparedGamesNewestFirst = [];
var _gamesByPlayer = {};
var GAMES_PER_PAGE = 20;
var _statsEl = document.getElementById("stats");
var _tbodyEl = document.getElementById("tbody");
var _gamesTitleEl = document.getElementById("games-title");
var _gamesSummaryEl = document.getElementById("gamesSummary");
var _filterBarEl = document.getElementById("filterBar");
var _gamesListEl = document.getElementById("gamesList");
var _paginationEl = document.getElementById("pagination");
var _tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

function getGameUrl(game) {
  var host = game.server === "knightbyte"
    ? "https://tm.knightbyte.win"
    : "https://terraforming-mars.herokuapp.com";
  var endId = game.endId || game.spectatorId || "";
  if (endId) {
    return host + "/the-end?id=" + endId;
  }
  var id = game.gameId || game._key || "";
  return host + "/game?id=" + id;
}

function getGameLabel(game) {
  return game.gameId || game._key || game.endId || "";
}

function esc(s) {
  var d = document.createElement("span");
  d.textContent = s;
  return d.innerHTML;
}

function round2(value) {
  var fixed = (Math.round(value * 100) / 100).toFixed(2);
  fixed = fixed.replace(/\.00$/, "");
  fixed = fixed.replace(/(\.\d)0$/, "$1");
  return fixed;
}

function round1(value) {
  var fixed = (Math.round(value * 10) / 10).toFixed(1);
  return fixed.endsWith(".0") ? fixed.slice(0, -2) : fixed;
}

function formatMargin(value) {
  if (typeof value !== "number" || isNaN(value)) return "-";
  if (Math.abs(value) < 0.05) return "0";
  return (value > 0 ? "+" : "") + round1(value);
}

function averageGeneration(games) {
  var values = games
    .map(function(g) { return Number(g.generation || 0); })
    .filter(function(v) { return v > 0; });
  if (values.length === 0) return "-";
  var total = values.reduce(function(sum, value) { return sum + value; }, 0);
  return round1(total / values.length);
}

function parseGameDate(value) {
  if (value instanceof Date) {
    return isNaN(value.getTime()) ? null : value;
  }
  if (typeof value === "number" && value > 0) {
    return new Date(value * 1000);
  }
  if (typeof value === "string" && value) {
    return new Date(value);
  }
  return null;
}

function resolveGameDate(game) {
  return parseGameDate(game.date) || parseGameDate(game.completedTime) || null;
}

function formatDate(value) {
  var date = parseGameDate(value);
  if (!date) return "";
  if (isNaN(date.getTime())) return "";
  return date.toLocaleString([], {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatDuration(game) {
  var durationMinutes = Number(game.durationMinutes);
  if (!(durationMinutes > 0)) {
    var durationMs = Number(game.durationMs);
    if (durationMs > 0) {
      durationMinutes = Math.round(durationMs / 60000);
    }
  }
  if (!(durationMinutes > 0)) {
    var startedTime = Number(game.startedTime);
    var completedTime = Number(game.completedTime);
    if (startedTime > 0 && completedTime > startedTime) {
      durationMinutes = Math.round((completedTime - startedTime) / 60);
    }
  }
  if (!(durationMinutes > 0)) return "";
  if (durationMinutes < 60) return durationMinutes + "m";
  var hours = Math.floor(durationMinutes / 60);
  var minutes = durationMinutes % 60;
  if (minutes === 0) return hours + "h";
  return hours + "h " + minutes + "m";
}

function normalizeStringList(value) {
  var values = [];
  if (Array.isArray(value)) values = value;
  else if (typeof value === "string" && value) values = value.split(",");
  return values
    .map(function(entry) { return typeof entry === "string" ? entry.trim() : ""; })
    .filter(function(entry) { return entry !== ""; });
}

function badgeSlug(value) {
  return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function renderGameMetaBadges(game) {
  var html = "";
  var source = typeof game.source === "string" ? game.source.trim() : "";
  if (source) {
    var sourceSlug = badgeSlug(source);
    html += "<span class=\"game-badge game-badge-source game-badge-source-" + esc(sourceSlug) + "\">" + esc(source) + "</span>";
  }
  normalizeStringList(game.analyzedBy).forEach(function(entry) {
    var slug = badgeSlug(entry);
    html += "<span class=\"game-badge game-badge-review game-badge-review-" + esc(slug) + "\">" + esc(entry) + "</span>";
  });
  normalizeStringList(game.analysisTargets).forEach(function(entry) {
    html += "<span class=\"game-badge game-badge-target\">" + esc(entry) + "</span>";
  });
  return html;
}

function getPlayerMargin(game, playerKey) {
  var results = (game.results || []);
  if (!results.length) return 0;
  var mine = results.find(function(r) { return r.name === playerKey; });
  if (!mine) return 0;
  var leaderVp = results.reduce(function(max, current) {
    return Math.max(max, Number(current.vp || 0));
  }, Number.NEGATIVE_INFINITY);
  if (!isFinite(leaderVp)) return 0;
  if ((mine.place || 99) === 1) {
    var others = results
      .filter(function(r) { return r !== mine; })
      .map(function(r) { return Number(r.vp || 0); });
    if (!others.length) return 0;
    return Number(mine.vp || 0) - Math.max.apply(null, others);
  }
  return Number(mine.vp || 0) - leaderVp;
}

function buildDerivedPlayerStats(games) {
  var stats = {};
  games.forEach(function(game) {
    (game.results || []).forEach(function(result) {
      var key = result.name;
      if (!key) return;
      if (!stats[key]) {
        stats[key] = {
          games: 0,
          totalGens: 0,
          genGames: 0,
          totalMargin: 0
        };
      }
      var item = stats[key];
      item.games += 1;
      if (Number(game.generation) > 0) {
        item.totalGens += Number(game.generation);
        item.genGames += 1;
      }
      item.totalMargin += getPlayerMargin(game, key);
    });
  });
  Object.keys(stats).forEach(function(key) {
    var item = stats[key];
    item.avgGens = item.genGames > 0 ? item.totalGens / item.genGames : 0;
    item.avgMargin = item.games > 0 ? item.totalMargin / item.games : 0;
  });
  return stats;
}

function prepareGameForRender(game) {
  var prepared = Object.assign({}, game);
  prepared.resultsSorted = (game.results || []).slice().sort(function(a, b) {
    return a.place - b.place;
  });
  prepared.genText = game.generation ? ("Gen " + game.generation) : "";
  prepared.durationText = formatDuration(game);
  prepared.dateValue = resolveGameDate(game);
  prepared.dateText = prepared.dateValue ? formatDate(prepared.dateValue) : "";
  prepared.metaBadgesHtml = renderGameMetaBadges(game);
  prepared.url = getGameUrl(game);
  prepared.label = getGameLabel(game);
  prepared.playerKeys = prepared.resultsSorted
    .map(function(result) { return result.name; })
    .filter(function(name) { return !!name; });
  return prepared;
}

function buildPreparedGameCaches(games) {
  var newestFirst = (games || []).slice().reverse().map(prepareGameForRender);
  var byPlayer = {};
  newestFirst.forEach(function(game) {
    (game.playerKeys || []).forEach(function(playerKey) {
      if (!byPlayer[playerKey]) byPlayer[playerKey] = [];
      byPlayer[playerKey].push(game);
    });
  });
  return {
    newestFirst: newestFirst,
    byPlayer: byPlayer
  };
}

function getPageCount(totalGames) {
  return Math.max(1, Math.ceil(totalGames / GAMES_PER_PAGE));
}

function renderPlayers() {
  if (!_data) return;
  var players = _data.players || {};
  var list = [];
  for (var name in players) {
    var p = players[name];
    var derived = _derivedPlayerStats[name] || {};
    var elo = _mode === "vp" ? (p.elo_vp || p.elo || 1500) : (p.elo || 1500);
    var games = p.games || 0;
    var avgPlace = typeof p.avgPlace === "number" ? p.avgPlace :
      (games > 0 ? ((typeof p.placeScoreTotal === "number" ? p.placeScoreTotal : (p.wins || 0)) / games) : 0);
    var avgVP = typeof p.avgVP === "number" ? p.avgVP :
      (games > 0 ? ((p.totalVP || 0) / games) : 0);
    var avgGens = (typeof p.avgGens === "number" && p.avgGens > 0) ? p.avgGens :
      (derived.avgGens || (games > 0 ? ((p.totalGens || 0) / games) : 0));
    var avgMargin = typeof p.avgMargin === "number" && (Math.abs(p.avgMargin) > 0.001 || !derived.games) ?
      p.avgMargin :
      (typeof derived.avgMargin === "number" ? derived.avgMargin : 0);
    list.push({
      key: name,
      name: p.displayName || name,
      elo: Math.round(elo),
      games: games,
      avgPlace: avgPlace,
      avgVP: avgVP,
      avgGens: avgGens,
      avgMargin: avgMargin
    });
  }
  list.sort(function(a,b) { return b.elo - a.elo; });
  var games = _data.games || [];
  _statsEl.innerHTML = list.length + " players | " + games.length + " games | <span class=\"highlight\">Avg gen " + averageGeneration(games) + "</span>";
  var html = "";
  list.forEach(function(p, i) {
    var activeClass = (_filterPlayer && _filterPlayer === p.key) ? " active-filter" : "";
    html += "<tr><td class=\"rank\">" + (i+1) + "</td>"
      + "<td><span class=\"player-link" + activeClass + "\" data-player=\"" + esc(p.key) + "\">" + esc(p.name) + "</span></td>"
      + "<td class=\"elo\">" + p.elo + "</td>"
      + "<td class=\"place\">" + round2(p.avgPlace) + "</td>"
      + "<td class=\"games\">" + p.games + "</td>"
      + "<td>" + round1(p.avgVP) + "</td>"
      + "<td>" + round1(p.avgGens) + "</td>"
      + "<td>" + formatMargin(p.avgMargin) + "</td></tr>";
  });
  _tbodyEl.innerHTML = html;
}

function getFilteredGames() {
  if (_filterPlayer) {
    return _gamesByPlayer[_filterPlayer] || [];
  }
  return _preparedGamesNewestFirst;
}

function renderGames() {
  var games = getFilteredGames();
  var totalPages = getPageCount(games.length);
  if (_gamesPage > totalPages) _gamesPage = totalPages;
  if (_gamesPage < 1) _gamesPage = 1;

  if (_filterPlayer && _data && _data.players && _data.players[_filterPlayer]) {
    var dn = _data.players[_filterPlayer].displayName || _filterPlayer;
    _filterBarEl.innerHTML = "<span class=\"filter-tag\">" + esc(dn) + " (" + games.length + " games)<span class=\"clear\" id=\"clearFilterBtn\"> x</span></span>";
    _gamesTitleEl.textContent = dn + " \u2014 Game History";
  } else {
    _filterBarEl.innerHTML = "";
    _gamesTitleEl.textContent = "Recent Games";
  }

  _gamesSummaryEl.textContent = games.length + " games | Avg gen " + averageGeneration(games) + " | Page " + _gamesPage + " / " + totalPages;

  var pageStart = (_gamesPage - 1) * GAMES_PER_PAGE;
  var toShow = games.slice(pageStart, pageStart + GAMES_PER_PAGE);
  if (toShow.length === 0) {
    _gamesListEl.innerHTML = "<div class=\"no-games\">No games found</div>";
    renderPagination(0);
    return;
  }

  var html = "";
  toShow.forEach(function(g) {
    html += "<div class=\"game-card\">";
    html += "<div class=\"game-header\">";
    html += "<span><span class=\"game-server\">" + esc(g.server || "") + "</span>";
    if (g.genText) html += " \u00b7 <span class=\"game-gen\">" + g.genText + "</span>";
    html += " \u00b7 " + g.resultsSorted.length + "P</span>";
    html += "<span class=\"game-header-right\">";
    if (g.durationText) html += "<span class=\"game-duration\">" + esc(g.durationText) + "</span>";
    if (g.dateText) html += "<span class=\"game-date\">" + esc(g.dateText) + "</span>";
    if (g.metaBadgesHtml) html += "<span class=\"game-badges\">" + g.metaBadgesHtml + "</span>";
    html += "<a href=\"" + g.url + "\" target=\"_blank\">" + esc(g.label) + "</a>";
    html += "</span>";
    html += "</div>";
    html += "<div class=\"game-results\">";

    g.resultsSorted.forEach(function(r, idx) {
      var isWinner = r.place === 1;
      var deltaClass = r.delta > 0 ? "pos" : (r.delta < 0 ? "neg" : "zero");
      var deltaText = r.delta > 0 ? "+" + r.delta : "" + r.delta;
      var vpText = r.vp ? (r.vp + "VP") : "";
      var corpText = r.corp || "";

      if (idx > 0) html += "<span class=\"game-sep\">\u203a</span>";
      html += "<span class=\"game-player" + (isWinner ? " winner" : "") + "\">";
      html += "<span class=\"pname player-link\" data-player=\"" + esc(r.name) + "\">" + esc(r.displayName || r.name) + "</span>";
      if (vpText) html += " <span class=\"pvp\">" + vpText + "</span>";
      html += " <span class=\"pdelta " + deltaClass + "\">(" + deltaText + ")</span>";
      if (corpText) html += " <span class=\"pcorp\">" + esc(corpText) + "</span>";
      html += "</span>";
    });

    html += "</div></div>";
  });

  _gamesListEl.innerHTML = html;
  renderPagination(games.length);
}

function renderPagination(totalGames) {
  if (!_paginationEl) return;
  if (totalGames <= GAMES_PER_PAGE) {
    _paginationEl.innerHTML = "";
    return;
  }

  var totalPages = getPageCount(totalGames);
  var startPage = Math.max(1, _gamesPage - 2);
  var endPage = Math.min(totalPages, startPage + 4);
  startPage = Math.max(1, endPage - 4);
  var html = "";
  html += "<button id=\"pagePrevBtn\"" + (_gamesPage <= 1 ? " disabled" : "") + ">\u2039</button>";
  for (var page = startPage; page <= endPage; page++) {
    html += "<button class=\"page-btn" + (page === _gamesPage ? " active" : "") + "\" data-page=\"" + page + "\">" + page + "</button>";
  }
  html += "<button id=\"pageNextBtn\"" + (_gamesPage >= totalPages ? " disabled" : "") + ">\u203a</button>";
  html += "<span class=\"pagination-status\">" + ((_gamesPage - 1) * GAMES_PER_PAGE + 1) + "-" + Math.min(_gamesPage * GAMES_PER_PAGE, totalGames) + " / " + totalGames + "</span>";
  _paginationEl.innerHTML = html;
}

function goToPage(page) {
  var totalPages = getPageCount(getFilteredGames().length);
  _gamesPage = Math.max(1, Math.min(totalPages, page));
  renderGames();
  _gamesTitleEl.scrollIntoView({ behavior: "smooth" });
}

function toggleFilter(playerKey) {
  if (_filterPlayer === playerKey) {
    _filterPlayer = null;
  } else {
    _filterPlayer = playerKey;
  }
  _gamesPage = 1;
  renderPlayers();
  renderGames();
  _gamesTitleEl.scrollIntoView({ behavior: "smooth" });
}

function clearFilter() {
  _filterPlayer = null;
  _gamesPage = 1;
  renderPlayers();
  renderGames();
}

// Event delegation for player clicks
document.addEventListener("click", function(e) {
  var el = e.target.closest(".player-link");
  if (el && el.dataset.player) {
    toggleFilter(el.dataset.player);
  }
});

_filterBarEl.addEventListener("click", function(e) {
  var clearBtn = e.target.closest("#clearFilterBtn");
  if (clearBtn) clearFilter();
});

_paginationEl.addEventListener("click", function(e) {
  var btn = e.target.closest("button");
  if (!btn || btn.disabled) return;
  if (btn.id === "pagePrevBtn") {
    goToPage(_gamesPage - 1);
    return;
  }
  if (btn.id === "pageNextBtn") {
    goToPage(_gamesPage + 1);
    return;
  }
  if (btn.classList.contains("page-btn")) {
    goToPage(Number(btn.dataset.page || 1));
  }
});

_tabs.forEach(function(tab) {
  tab.addEventListener("click", function() {
    _tabs.forEach(function(t) { t.classList.remove("active"); });
    tab.classList.add("active");
    _mode = tab.dataset.mode;
    renderPlayers();
  });
});

fetch("elo-data.json?ts=" + Date.now(), { cache: "no-store" }).then(function(r){return r.json()}).then(function(data) {
  _data = data;
  var baseGames = (_data && _data.games) ? _data.games : [];
  _derivedPlayerStats = buildDerivedPlayerStats(baseGames);
  var prepared = buildPreparedGameCaches(baseGames);
  _preparedGamesNewestFirst = prepared.newestFirst;
  _gamesByPlayer = prepared.byPlayer;
  renderPlayers();
  renderGames();
}).catch(function(e) {
  _tbodyEl.innerHTML = "<tr><td colspan=\"8\">Error: " + e.message + "</td></tr>";
});
</script>
