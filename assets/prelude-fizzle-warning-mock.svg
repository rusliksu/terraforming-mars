<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d2430"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4f1eb"/>
      <stop offset="100%" stop-color="#e7e0d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 30px Segoe UI, Arial, sans-serif; fill: #1c2430; }
      .subtitle { font: 600 20px Segoe UI, Arial, sans-serif; fill: #364152; }
      .label { font: 700 16px Segoe UI, Arial, sans-serif; fill: #546072; letter-spacing: 0.08em; text-transform: uppercase; }
      .body { font: 600 17px Segoe UI, Arial, sans-serif; fill: #263142; }
      .small { font: 15px Segoe UI, Arial, sans-serif; fill: #596579; }
      .warn { font: 700 15px Segoe UI, Arial, sans-serif; fill: #9d5414; }
      .button { font: 700 18px Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .button2 { font: 700 18px Segoe UI, Arial, sans-serif; fill: #364152; }
      .mc { font: 700 17px Segoe UI, Arial, sans-serif; fill: #0f1722; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>

  <rect x="70" y="70" width="700" height="840" rx="26" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="830" y="70" width="700" height="840" rx="26" fill="url(#panel)" filter="url(#shadow)"/>

  <text x="110" y="130" class="label">Mockup A</text>
  <text x="110" y="172" class="title">New Partner</text>
  <text x="110" y="208" class="subtitle">Select prelude card to play</text>

  <circle cx="125" cy="275" r="11" fill="none" stroke="#68758a" stroke-width="3"/>
  <text x="150" y="282" class="body">Donation</text>

  <circle cx="125" cy="375" r="11" fill="none" stroke="#68758a" stroke-width="3"/>
  <circle cx="125" cy="375" r="5.5" fill="#46556d"/>
  <text x="150" y="382" class="body">Strategic Base Planning</text>

  <rect x="120" y="418" width="300" height="400" rx="20" fill="#cbced3" stroke="#8b9098" stroke-width="4"/>
  <rect x="145" y="452" width="250" height="28" rx="10" fill="#b5b9c0"/>
  <rect x="145" y="504" width="250" height="220" rx="18" fill="#d7d9dd"/>
  <rect x="145" y="746" width="150" height="34" rx="10" fill="#b7bbc2"/>
  <text x="175" y="775" class="small">card-unavailable</text>

  <rect x="455" y="438" width="250" height="120" rx="18" fill="#fff3d6" stroke="#e6b86b" stroke-width="2"/>
  <text x="480" y="476" class="warn">This prelude is not playable,</text>
  <text x="480" y="504" class="warn">so you will discard it and</text>
  <text x="480" y="532" class="warn">gain 15 M€.</text>

  <rect x="110" y="842" width="150" height="48" rx="14" fill="#376fd3"/>
  <text x="166" y="873" class="button">Play</text>
  <text x="290" y="873" class="small">Card stays clickable even though it looks unavailable.</text>

  <text x="870" y="130" class="label">Mockup B</text>
  <text x="870" y="172" class="title">Board of Directors</text>
  <text x="870" y="208" class="subtitle">Would you like pay 12 M€ and one Director to play Strategic Base Planning</text>

  <circle cx="885" cy="290" r="11" fill="none" stroke="#68758a" stroke-width="3"/>
  <circle cx="885" cy="290" r="5.5" fill="#46556d"/>
  <text x="910" y="297" class="body">Strategic Base Planning</text>

  <rect x="880" y="340" width="300" height="400" rx="20" fill="#cbced3" stroke="#8b9098" stroke-width="4"/>
  <rect x="905" y="374" width="250" height="28" rx="10" fill="#b5b9c0"/>
  <rect x="905" y="426" width="250" height="220" rx="18" fill="#d7d9dd"/>
  <rect x="905" y="668" width="150" height="34" rx="10" fill="#b7bbc2"/>
  <text x="935" y="697" class="small">card-unavailable</text>

  <rect x="1215" y="362" width="270" height="132" rx="18" fill="#fff3d6" stroke="#e6b86b" stroke-width="2"/>
  <text x="1240" y="400" class="warn">After paying 12 M€,</text>
  <text x="1240" y="428" class="warn">this prelude would fizzle</text>
  <text x="1240" y="456" class="warn">and give 15 M€.</text>

  <rect x="870" y="808" width="150" height="48" rx="14" fill="#376fd3"/>
  <text x="925" y="839" class="button">Buy</text>
  <rect x="1040" y="808" width="150" height="48" rx="14" fill="#d8dde7"/>
  <text x="1092" y="839" class="button2">Skip</text>

  <rect x="1235" y="780" width="215" height="100" rx="18" fill="#11161f" opacity="0.72"/>
  <text x="1260" y="818" class="small" fill="#dce4f3">Player MC before click: 13</text>
  <text x="1260" y="846" class="small" fill="#dce4f3">Buy selected</text>
  <text x="1260" y="874" class="mc" fill="#ffffff">13 - 12 + 15 = 16 M€</text>
</svg>
