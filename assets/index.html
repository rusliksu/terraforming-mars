<!DOCTYPE html>
<html>
    <head>
        <link
            href="https://fonts.googleapis.com/css?family=Ubuntu&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" media="all" href="styles.css" />
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
        <meta name="viewport" content='width=1260, user-scalable=1' />
        <meta name="description" content="Terraforming Mars Open Source Web Application" />
        <style>
            #tm-env-badge {
                position: fixed;
                top: 14px;
                right: 14px;
                z-index: 9999;
                display: none;
                padding: 8px 14px;
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 999px;
                background: rgba(163, 36, 19, 0.92);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
                color: #fff4d6;
                font-family: 'Ubuntu', sans-serif;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                pointer-events: none;
            }
        </style>
    </head>
    <body id="ts-preferences-target">
        <div id="tm-env-badge" aria-hidden="true">Staging</div>
        <div id="app">
          <div :class="'topmost-'+screen">
            <section>
                <dialog id="alert-dialog" class="alert-dialog">
                    <form method="dialog">
                        <p id="alert-title" class="title" v-i18n>Error with input</p>
                        <p id="alert-dialog-message"></p>
                        <menu class="dialog-menu centered-content">
                            <button id="alert-dialog-button" class="btn btn-lg btn-primary">OK</button>
                        </menu>
                    </form>
                </dialog>
            </section>
            <div class="main-container">
                <start-screen v-if="screen === 'start-screen'" :version="settings.version"></start-screen>
                <create-game-form
                    v-else-if="screen === 'create-game-form'"
                ></create-game-form>
                <load-game-form v-else-if="screen === 'load'"></load-game-form>
                <game-home
                    v-else-if="screen === 'game-home'"
                    :game="game"
                ></game-home>
                <player-home
                    v-else-if="screen === 'player-home' && playerView !== undefined"
                    :player-view="playerView"
                    :key="playerkey"
                    :settings="settings"
                ></player-home>
                <spectator-home
                    v-else-if="screen === 'spectator-home' && spectator !== undefined"
                    :spectator="spectator"
                    :key="'spectator-' + playerkey"
                    :settings="settings"
                ></spectator-home>
                <game-end
                    v-else-if="screen === 'the-end'"
                    :player-view="playerView"
                    :spectator="spectator"
                ></game-end>
                <games-overview
                    v-else-if="screen === 'games-overview'"
                ></games-overview>
                <card-list v-else-if="screen === 'cards'"></card-list>
                <admin-home v-else-if="screen === 'admin'"></admin-home>
                <login-home v-else-if="screen === 'login-home'"></login-home>
                <Help v-else-if="screen === 'help'"></Help>
            </div>
            <div class="notice" v-i18n>
                Not affiliated with FryxGames, Asmodee Digital or Steam in any way.
            </div>
          </div>
        </div>
        <script>
            (function() {
                if (window.location.hostname === 'staging.tm.knightbyte.win') {
                    var badge = document.getElementById('tm-env-badge');
                    if (badge !== null) {
                        badge.style.display = 'block';
                    }
                }
            })();
        </script>
        <script src="vendors.js"></script>
        <script src="main.js"></script>
    </body>
</html>
