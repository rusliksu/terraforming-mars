name: CI

on: [pull_request, push]

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Test durable production promotion lifecycle
      shell: pwsh
      run: |
        ./scripts/test_tm_durable_job_observer.ps1
        ./scripts/test_tm_durable_promotion.ps1
    - run: npm ci
    - run: npm run make:static
    - run: npm run lint
    - run: npm run build
    - run: npm run build:tests
    - run: npm test

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Test upstream sync guardrails
      shell: pwsh
      run: ./scripts/test_tm_upstream_sync.ps1
    - name: Test release guardrails
      shell: pwsh
      run: ./scripts/test_tm_release_guards.ps1
    - name: Test durable job observer
      shell: pwsh
      run: ./scripts/test_tm_durable_job_observer.ps1
    - name: Test server smoke verification
      shell: pwsh
      run: ./scripts/test_tm_verify_server.ps1
    - run: npm ci
    - run: npm run make:static
    - run: npm run lint
    - run: npm run build
    - run: npm run build:tests
    - run: npm test

  build-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - run: docker build .


