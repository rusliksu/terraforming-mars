      <stop offset="24%" stop-color="#ffc92f"/>
      <stop offset="62%" stop-color="#ca830d"/>
      <stop offset="100%" stop-color="#6c2f00"/>
    </linearGradient>
    <linearGradient id="gold-face" x1="14%" y1="10%" x2="84%" y2="92%">
