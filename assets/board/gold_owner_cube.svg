<svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21">
  <defs>
    <linearGradient id="gold-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d9"/>
      <stop offset="26%" stop-color="#f7d56c"/>
      <stop offset="70%" stop-color="#d59523"/>
      <stop offset="100%" stop-color="#83500a"/>
    </linearGradient>
    <linearGradient id="gold-face" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#fff8cf"/>
      <stop offset="40%" stop-color="#f5cc59"/>
      <stop offset="100%" stop-color="#c47d12"/>
    </linearGradient>
    <linearGradient id="gold-core" x1="14%" y1="8%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="38%" stop-color="#f0ca53"/>
      <stop offset="100%" stop-color="#b66a0d"/>
    </linearGradient>
    <linearGradient id="gold-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="58%" stop-color="#fff8d7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fff8d7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold-reflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf2" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fffdf2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fffdf2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <polygon
    points="10.5,1.2 19.1,10.5 10.5,19.8 1.9,10.5"
    fill="url(#gold-edge)"
    stroke="#fff8d8"
    stroke-width="0.7"
    stroke-linejoin="round"
  />

  <polygon
