    stroke="#9a5f0a"
    stroke-width="0.55"
    stroke-linejoin="round"
  />

  <polygon
    points="10.5,4.6 15.7,10.5 10.5,16.4 5.3,10.5"
    fill="url(#gold-core)"
    stroke="#f8dc86"
    stroke-width="0.45"
